// Shared proto contract for host(Rust) <-> sidecar(Go) gRPC traffic.
//
// This directory is the single source of truth for the gRPC wire format,
// consumed by both the Go sidecar (via protoc, see
// sidecar/grpc/kubecontextpb) and the Rust host (via tonic-build, see
// src-tauri/build.rs). It deliberately sits at the repo root, outside the
// Go module, mirroring the layout in ~/workspace/kubetail.
syntax = "proto3";

package kubecontext;

option go_package = "github.com/kubetail-org/kstack-app/sidecar/grpc/kubecontextpb";

// KubeContextService is the host-internal control channel for the kubeconfig
// current-context. It rides the same socket as GraphQL (h2c multiplexing) but
// is consumed only by the native host (the tray), never the webview — the
// webview keeps using the GraphQL kubeConfigWatch/setCurrentContext surface.
// Both transports share the one KubeConfigWatcher, so a change made through
// either is observed by the other.
service KubeContextService {
  // Watch streams the kubeconfig context state: one full snapshot immediately,
  // then a new full snapshot on every on-disk change. Long-lived; the stream
  // ends when the client cancels or the sidecar shuts down.
  rpc Watch(WatchRequest) returns (stream KubeContextState);

  // SetCurrentContext persists `name` as the kubeconfig current-context
  // (kubectl-visible). The resulting change is also delivered to any active
  // Watch stream. Errors with InvalidArgument for an empty/unknown name.
  rpc SetCurrentContext(SetCurrentContextRequest) returns (SetCurrentContextResponse);
}

message WatchRequest {}

// KubeContextState is a full snapshot of the parts of the kubeconfig the host
// cares about. Every Watch message carries the complete current state.
message KubeContextState {
  string current_context = 1;
  repeated Context contexts = 2;
}

message Context {
  string name = 1;
}

message SetCurrentContextRequest {
  string name = 1;
}

message SetCurrentContextResponse {}
