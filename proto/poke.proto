// Shared proto contract for host(Rust) <-> sidecar(Go) gRPC resync control channel.
//
// This file is the single source of truth for the PokeService wire format,
// consumed by both the Go sidecar (via protoc, see sidecar/grpc/pokepb) and
// the Rust host (via tonic-build, see src-tauri/build.rs). It deliberately
// sits at the repo root alongside kubecontext.proto and auth.proto.
syntax = "proto3";

package poke;

option go_package = "github.com/kubetail-org/kstack-app/sidecar/grpc/pokepb";

// PokeService is the host-internal resync channel. The native host calls Poke
// when the OS resumes from sleep or the network becomes reachable again; the
// sidecar broadcasts a SourceHost resync signal to every in-process subscriber
// (today the per-cluster Kubernetes sync and the cloud settings engine), waking
// long-lived network connections that may have gone stale. It rides the same
// socket as GraphQL and the other gRPC services (h2c multiplexing) and is
// consumed only by the native host, never the webview.
//
// The sidecar also has a built-in wall-clock gap detector that fires the same
// resync internally, so Poke is an accelerator for an explicit host wake event,
// not the only path.
service PokeService {
  // Poke broadcasts a resync signal to every in-process subscriber. Unary and
  // best-effort: it never blocks and returns as soon as the signal is queued.
  rpc Poke(PokeRequest) returns (PokeResponse);
}

message PokeRequest {}
message PokeResponse {}
