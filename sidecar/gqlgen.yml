schema:
  - graph/*.graphqls

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

autobind:
  - github.com/kubetail-org/kstack-app/sidecar/graph/model

models:
  # --- Cluster ---
  # The GraphQL Cluster types bind 1:1 (same name) to the internal/cluster
  # domain types — gqlgen autobinds with no wrapper. The schema mirrors beehive's
  # owner chain: Cluster.status is the Cluster kind's stored status, and the
  # ClusterCache child carries the ClusterCache kind's sync status (`status`) plus
  # live on-disk `stats` (a resolver, so a query pays the stat cost only when it
  # selects them). The ClusterCache child carries the cluster ID for that resolver.
  Cluster:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster.Cluster

  ClusterSpec:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster.ClusterSpec

  ClusterSource:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster.ClusterSource

  ClusterSourceKubeconfig:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster.ClusterSourceKubeconfig

  ClusterSourceStatus:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster.ClusterSourceStatus

  ClusterStatus:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster.ClusterStatus

  ClusterServer:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster.ClusterServer

  ClusterKubeconfig:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster.ClusterKubeconfig

  ClusterPrincipal:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster.ClusterPrincipal
    fields:
      permissions:
        resolver: true

  # The conditions ride the wire as-is (the domain shapes; the webview derives
  # display state from type/status/reason).
  ClusterCondition:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster.ClusterCondition

  ConditionStatus:
    model: github.com/amorey/beehive.ConditionStatus

  ClusterCache:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster.ClusterCache
    fields:
      stats:
        resolver: true

  ClusterCacheStatus:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster.ClusterCacheStatus

  ClusterCacheStats:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster.ClusterCacheStats

  CachedResource:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster.CachedResource

  # --- Auth ---
  # Bind the GraphQL auth types straight to the auth domain types so the
  # resolvers need no field-by-field mapper. Only schema fields are exposed —
  # State.Tokens never reaches the wire — and Identity's `sub` claim maps onto
  # the domain's UserID field.
  AuthState:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/auth.State

  Identity:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/auth.Identity
    fields:
      sub:
        fieldName: UserID

  # --- gqlgen ---
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - k8s.io/apimachinery/pkg/types.UID
      - github.com/kubetail-org/kstack-app/sidecar/internal/cluster.ClusterID

  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32

  String:
    model:
      - github.com/99designs/gqlgen/graphql.String
      - github.com/kubetail-org/kstack-app/sidecar/internal/cluster.ClusterConditionType
