schema:
  - graph/*.graphqls

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

autobind:
  - github.com/kubetail-org/kstack-app/sidecar/graph/model

models:
  # --- Cluster ---
  # The GraphQL Cluster types bind 1:1 (same name) to the internal/cluster/domain
  # types — gqlgen autobinds with no wrapper. The schema mirrors beehive's
  # owner chain: Cluster.status is the Cluster kind's stored status, and the
  # ClusterCache child carries the ClusterCache kind's sync status (`status`) plus
  # live on-disk `stats` (a resolver, so a query pays the stat cost only when it
  # selects them). The ClusterCache child carries the cluster ID for that resolver.
  Cluster:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.Cluster
    fields:
      # Both are separate beehive reads, kept off the record and run only when
      # selected: event chatter must not ride the cluster watch, and the owned
      # caches stream standalone so cache churn never re-emits a cluster.
      caches:
        resolver: true
      events:
        resolver: true

  ClusterSpec:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterSpec

  ClusterSpecSource:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterSpecSource

  ClusterSpecSourceKubeconfig:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterSpecSourceKubeconfig

  ClusterStatusSource:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterStatusSource

  ClusterStatus:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterStatus

  ClusterServer:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterServer

  ClusterStatusSourceKubeconfig:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterStatusSourceKubeconfig

  ClusterPrincipal:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterPrincipal
    fields:
      permissions:
        resolver: true

  # The conditions ride the wire as-is (the domain shapes; the webview derives
  # display state from type/status/reason). Unprefixed shared vocabulary: the same
  # Condition rides both the Cluster kind's status and the ClusterCache kind's, so
  # it belongs to no single storage provenance.
  #
  # Condition/Event/Schedule are shared, kind-agnostic vocabulary on the wire but
  # live in `internal/cluster` only because it's their sole consumer today. The
  # wire-universal (unprefixed) name and the internal package home are orthogonal:
  # the unprefixed name says "not specific to one wire namespace", not "must live
  # package-neutral". When a non-cluster kind/subsystem first needs conditions,
  # hoist all three together into a shared leaf package (e.g. internal/apimeta),
  # leaving cluster its ConditionType constants (Connected/Healthy/Synced) — see
  # sidecar/CLAUDE.md. Until that second consumer exists, a shared package would be
  # a one-importer abstraction, so they stay here.
  Condition:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.Condition

  # The generic event surface. Event binds 1:1 to the domain type; its run id
  # rides the shared ObjectID scalar (no dedicated Event id scalar), and EventType
  # binds straight to beehive.EventType (values Normal/Warning match), the same
  # external-enum pattern as ConditionStatus.
  Event:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.Event

  EventType:
    model: github.com/amorey/beehive.EventType

  # The generic reconcile-schedule gauge (next-requeue countdown), decoupled from
  # the cluster/list watch. Binds 1:1 to the domain type.
  Schedule:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.Schedule

  ConditionStatus:
    model: github.com/amorey/beehive.ConditionStatus

  # The delta watches (clustersWatch / clusterCachesWatch). ChangeType binds to the
  # domain cluster.ChangeType (values Added/Modified/Deleted match the enum), the same
  # external-enum pattern as EventType/ConditionStatus — a defined type mirroring
  # beehive's, not beehive.ChangeType itself (that is an alias into an internal package
  # gqlgen can't import). The two change wrappers bind 1:1 to the domain types the watch
  # pumps emit.
  ChangeType:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ChangeType

  ClusterWatchFrame:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterWatchFrame

  ClusterCacheWatchFrame:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterCacheWatchFrame

  ClusterCache:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterCache
    fields:
      stats:
        resolver: true
      # kinds and events are separate reads (the cache's SQLite catalog, the beehive
      # event log), so both stay off the record and run only when selected.
      kinds:
        resolver: true
      syncs:
        resolver: true
      events:
        resolver: true

  # The sync children's served spec IS the stored beehive type (no projection layer).
  # Their `stats` are NOT: those are resolver fields sampled from the controller, because
  # status is a propagation channel and nothing in the object graph reads them.

  # Likewise the GVR-discovery child: stored spec/status served as-is.
  ClusterCacheGVRDiscovery:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterCacheGVRDiscovery
    fields:
      # Sampled from the controller on read, like ClusterCache.stats — it is not a field
      # of the stored object (the kind's status is empty by design).
      stats:
        resolver: true
  ClusterCacheGVRSync:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterCacheGVRSync
    fields:
      # Same shape as the discovery's: a controller-held gauge, not stored state.
      stats:
        resolver: true
      events:
        resolver: true
  ClusterCacheGVRSyncSpec:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterCacheGVRSyncSpec
  ClusterCacheGVRSyncStats:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterCacheGVRSyncStats
  ClusterCacheGVRSyncWatchFrame:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterCacheGVRSyncWatchFrame
  ClusterCacheSyncHealth:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterCacheSyncHealth
  SyncedKindRef:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.SyncedKindRef

  ClusterCacheGVRDiscoverySpec:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterCacheGVRDiscoverySpec

  ClusterCacheGVRDiscoveryStats:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterCacheGVRDiscoveryStats

  ClusterCacheGVRDiscoveryWatchFrame:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterCacheGVRDiscoveryWatchFrame

  ClusterCacheStats:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterCacheStats

  ClusterCacheResourceStats:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterCacheResourceStats

  ClusterDataKind:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterDataKind

  ClusterDataKindWatchFrame:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterDataKindWatchFrame

  ClusterDataEvent:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterDataEvent
    # The domain carries value time.Time (must stay comparable for the delta-watch diff),
    # so resolvers map the zero time to null instead of serializing 0001-01-01.
    fields:
      firstSeen:
        resolver: true
      lastSeen:
        resolver: true

  ClusterDataEventWatchFrame:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterDataEventWatchFrame

  ClusterDataObject:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterDataObject
    # The domain carries value time.Time (parallel to ClusterDataEvent), so the resolver
    # maps the zero creationTimestamp to null instead of serializing 0001-01-01. rawJSON
    # autobinds to the RawJSON field (no resolver): the watch already reads the body for
    # every row — the delta-diff needs it in the comparable struct — so gating its marshal
    # behind a resolver would defer nothing, and field-selection already skips it when a
    # query omits rawJSON.
    fields:
      creationTimestamp:
        resolver: true

  ClusterDataObjectWatchFrame:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ClusterDataObjectWatchFrame

  # --- Auth ---
  # Bind the GraphQL auth types straight to the auth domain types so the
  # resolvers need no field-by-field mapper. Only schema fields are exposed —
  # State.Tokens never reaches the wire — and Identity's `sub` claim maps onto
  # the domain's UserID field.
  AuthState:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/auth.State

  Identity:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/auth.Identity
    fields:
      sub:
        fieldName: UserID

  # The object-identity scalar binds to the typed int64 ObjectID (its
  # MarshalGQL/UnmarshalGQL handle the decimal-string wire form), so resolver
  # arguments arrive already typed — no per-resolver parsing. ClusterID (and
  # future per-kind ids) are aliases of this one type, sharing its machinery.
  ObjectID:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ObjectID

  # The JSON scalar binds to cluster.RawJSON — a comparable string carrying already-
  # serialized JSON, marshaled verbatim (see rawjson.go). It backs a cached object's
  # full native body on ClusterDataObject.
  JSON:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.RawJSON

  # --- gqlgen ---
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - k8s.io/apimachinery/pkg/types.UID

  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32

  String:
    model:
      - github.com/99designs/gqlgen/graphql.String
      - github.com/kubetail-org/kstack-app/sidecar/internal/cluster/domain.ConditionType
