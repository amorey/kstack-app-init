schema:
  - graph/*.graphqls

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

autobind:
  - github.com/kubetail-org/kstack-app/sidecar/graph/model

models:
  # --- Cluster ---
  # The GraphQL Cluster types bind 1:1 (same name) into internal/clustersvc —
  # gqlgen autobinds with no wrapper. The schema mirrors beehive's
  # owner chain: Cluster.status is the Cluster kind's stored status, and the
  # ClusterCache child carries the ClusterCache kind's sync status (`status`) plus the
  # cluster ID its resolvers read with.
  Cluster:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.Cluster
    fields:
      # Both are separate beehive reads, kept off the record and run only when
      # selected: event chatter must not ride the cluster watch, and the owned
      # caches stream standalone so cache churn never re-emits a cluster.
      caches:
        resolver: true
      events:
        resolver: true

  ClusterSpec:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterSpec

  ClusterSpecSource:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterSpecSource

  ClusterSpecSourceKubeconfig:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterSpecSourceKubeconfig

  ClusterStatusSource:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterStatusSource

  ClusterStatus:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterStatus

  ClusterServer:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterServer

  ClusterStatusSourceKubeconfig:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterStatusSourceKubeconfig

  ClusterPrincipal:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterPrincipal
    fields:
      permissions:
        resolver: true

  # The conditions ride the wire as-is (the stored shapes; the webview derives
  # display state from type/status/reason). Unprefixed shared vocabulary: the same
  # Condition rides both the Cluster kind's status and the ClusterCache kind's, so
  # it belongs to no single storage provenance.
  #
  # Condition/Event/Schedule are shared, kind-agnostic vocabulary on the wire but
  # live in `internal/clustersvc` only because it's their sole consumer today. The
  # wire-universal (unprefixed) name and the internal package home are orthogonal:
  # the unprefixed name says "not specific to one wire namespace", not "must live
  # package-neutral". When a non-cluster kind/subsystem first needs conditions,
  # hoist all three together into a shared leaf package (e.g. internal/apimeta),
  # leaving cluster its ConditionType constants (Connected/Healthy/Synced) — see
  # sidecar/CLAUDE.md. Until that second consumer exists, a shared package would be
  # a one-importer abstraction, so they stay here.
  Condition:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.Condition

  ObjectRef:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ObjectRef

  # The generic event surface. Event binds 1:1 to the Go type; its run id
  # rides the shared ObjectID scalar (no dedicated Event id scalar), and EventType
  # binds straight to beehive.EventType (values Normal/Warning match), the same
  # external-enum pattern as ConditionStatus.
  Event:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.Event

  # The event watches' envelope. Its own two-value enum rather than DeltaFrameType: the
  # log is append-only, so Added/Modified/Deleted would advertise transitions that
  # can never arrive.
  EventWatchFrame:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.EventWatchFrame

  EventFrameType:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.EventFrameType

  EventType:
    model: github.com/amorey/beehive.EventType

  # The generic reconcile-schedule gauge (next-requeue countdown), decoupled from
  # the cluster/list watch. Binds 1:1 to the Go type.
  Schedule:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.Schedule

  ConditionStatus:
    model: github.com/amorey/beehive.ConditionStatus

  # The delta watches. DeltaFrameType binds to types.DeltaFrameType (values
  # Added/Modified/Deleted match the enum), the same external-enum pattern as
  # EventType/ConditionStatus — a defined type mirroring beehive's ChangeType, not that
  # type itself (it aliases into an internal package gqlgen can't import). The frame
  # wrappers bind 1:1 to the types the watch pumps emit.
  DeltaFrameType:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.DeltaFrameType

  ClusterWatchFrame:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterWatchFrame

  ClusterCacheWatchFrame:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterCacheWatchFrame

  ClusterCache:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterCache
    fields:
      # kinds and events are separate reads (the cache's SQLite catalog, the beehive
      # event log), so both stay off the record and run only when selected.
      kinds:
        resolver: true
      cachedKinds:
        resolver: true
      events:
        resolver: true

  # The cache subtree's served spec IS the stored beehive type (no projection layer).
  ClusterCacheSpec:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterCacheSpec
  ClusterCachedKind:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterCachedKind
    fields:
      events:
        resolver: true
  ClusterCachedKindSpec:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterCachedKindSpec
    fields:
      # The wire's positive form over a stored Paused. The storage field is inverted so a
      # record written before it decodes as syncing; this resolver is the one negation.
      syncEnabled:
        resolver: true
  ClusterCachedKindWatchFrame:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterCachedKindWatchFrame
  ClusterCacheHealth:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterCacheHealth
  SyncedKindRef:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.SyncedKindRef

  ClusterCacheStats:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterCacheStats

  ClusterCacheSyncStatus:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterCacheSyncStatus
  ClusterCacheDiscoveryStatus:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterCacheDiscoveryStatus
  ClusterCacheKindSyncStatus:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterCacheKindSyncStatus

  ClusterCachedDataKind:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterCachedDataKind

  ClusterCachedDataKindWatchFrame:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterCachedDataKindWatchFrame

  # firstSeen/lastSeen autobind to value time.Time fields: gqlgen's Time marshaler emits null
  # for the zero time, which is exactly the wire's meaning of an absent timestamp.
  ClusterCachedDataEvent:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterCachedDataEvent

  ClusterCachedDataEventWatchFrame:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterCachedDataEventWatchFrame

  # creationTimestamp autobinds like the event timestamps above. rawJSON autobinds to the
  # RawJSON field too: the body is already read by the time the record exists — the watch
  # fetches one per frame it sends — so gating its marshal behind a resolver would defer
  # nothing.
  ClusterCachedDataObject:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterCachedDataObject

  ClusterCachedDataObjectWatchFrame:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ClusterCachedDataObjectWatchFrame

  # --- Auth ---
  # Bind the GraphQL auth types straight to the auth domain types so the
  # resolvers need no field-by-field mapper. Only schema fields are exposed —
  # State.Tokens never reaches the wire — and Identity's `sub` claim maps onto
  # the domain's UserID field.
  AuthState:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/auth.State

  Identity:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/auth.Identity
    fields:
      sub:
        fieldName: UserID

  # The object-identity scalar binds to the typed int64 ObjectID (its
  # MarshalGQL/UnmarshalGQL handle the decimal-string wire form), so resolver
  # arguments arrive already typed — no per-resolver parsing. ClusterID (and
  # future per-kind ids) are aliases of this one type, sharing its machinery.
  ObjectID:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ObjectID

  # The JSON scalar binds to clustersvc.RawJSON — a comparable string carrying already-
  # serialized JSON, marshaled verbatim (see rawjson.go). It backs a cached object's
  # full native body on ClusterCachedDataObject.
  JSON:
    model: github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.RawJSON

  # --- gqlgen ---
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - k8s.io/apimachinery/pkg/types.UID

  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32

  String:
    model:
      - github.com/99designs/gqlgen/graphql.String
      - github.com/kubetail-org/kstack-app/sidecar/internal/clustersvc.ConditionType
