schema:
  - graph/*.graphqls

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

autobind:
  - github.com/kubetail-org/kstack-app/sidecar/graph/model

models:
  # --- KubeConfig ---
  KubeConfig:
    model: github.com/kubetail-org/kstack-app/sidecar/graph/model.KubeConfig
    fields:
      authInfos:
        resolver: true
      clusters:
        resolver: true
      contexts:
        resolver: true

  KubeConfigAuthInfo:
    model: github.com/kubetail-org/kstack-app/sidecar/graph/model.KubeConfigAuthInfo

  KubeConfigCluster:
    model: github.com/kubetail-org/kstack-app/sidecar/graph/model.KubeConfigCluster

  KubeConfigContext:
    model: github.com/kubetail-org/kstack-app/sidecar/graph/model.KubeConfigContext

  KubeConfigExtensions:
    model: github.com/kubetail-org/kstack-app/sidecar/graph/model.KubeConfigExtensions

  # --- gqlgen ---
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - k8s.io/apimachinery/pkg/types.UID

  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
