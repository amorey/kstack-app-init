[package]
name = "kstack-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kstack_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async runtime for managing the sidecar lifecycle and UDS I/O.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "test-util"] }
# Cross-platform local sockets: UDS on Unix, AF_UNIX on Windows 10+.
interprocess = { version = "2", features = ["tokio"] }
thiserror = "1"
tokio-tungstenite = "0.24"
http = "1"
graphql-ws-client = { version = "0.13", features = ["tungstenite-0.24"] }
futures-util = "0.3"
log = "0.4"
tauri-plugin-log = "2"
libc = "0.2.186"

