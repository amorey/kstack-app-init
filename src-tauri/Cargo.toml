[package]
name = "kstack-app"
version = "0.1.0"
description = "Kstack App"
authors = ["The Kubetail Authors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kstack_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1   # whole-crate optimization instead of parallel chunks
lto = true          # link-time optimization across crate boundaries
opt-level = 3       # maximum runtime speed
strip = true        # strip symbols from the shipped binary

[features]
# Compiles the webview inspector (devtools) into an otherwise-release build so
# production behavior — e.g. the bundled CSP with its injected nonces — can be
# inspected. DO NOT ship: on macOS this links private WebKit APIs and triggers
# App Store rejection. Build with `pnpm tauri build --features debug-prod`.
debug-prod = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-oauth = "2.0.0"
# OIDC: discovery, PKCE, JWKS, and full ID-token verification (signature,
# iss/aud/exp/azp, nonce). `openidconnect` owns the whole protocol; it is built
# on `oauth2`, which it re-exports. rustls keeps the build off system TLS and
# the crypto pure-Rust for clean cross-compilation to every OS.
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
# keyring 4.x splits into a `keyring-core` API crate plus per-OS store crates
# (pulled in automatically as platform deps). The default store is registered
# at startup via `keyring::use_native_store`; `keyring-core` provides `Entry`.
keyring = "4.0.1"
keyring-core = "1"
# HTTP client `openidconnect` drives discovery, JWKS, token, and revocation
# requests through. rustls keeps the build off a system TLS dep.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# The OAuth flow runs an async loopback wait (`oneshot` + `timeout`); tauri's
# re-exported runtime does not cover those, so depend on tokio directly.
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "io-util"] }
# Cross-platform local IPC primitive: UDS on Unix, named pipes on Windows,
# behind a single Stream/Listener API. Lets `ipc.rs` and its tests avoid
# cfg-branching on the platform-specific tokio types.
interprocess = { version = "2", features = ["tokio"] }
# Host-side HTTP/1 client speaking to the sidecar over UDS. `hyper` provides
# the raw connection-level API (no global Client + Connector dance needed
# for a single in-process socket); `hyper-util`'s `TokioIo` adapts the
# `tokio::net::UnixStream` to hyper's I/O traits; `http-body-util` collects
# the response body into a single buffer for command return.
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# WebSocket client for graphql-transport-ws subscriptions. Run over the same
# UnixStream as HTTP — no TLS needed for a local socket, so default features
# (native-tls / rustls) are turned off.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
# Stream + Sink extension traits the WS read/write halves are driven through.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
zeroize = "1"

# macOS-only: a custom Dock menu has no Tauri/tao API, so it is built directly
# against AppKit. Versions are pinned to what Tauri already pulls in transitively.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSString",
  # Apple Events: detect a system-initiated quit (logout/restart/shutdown) in
  # `applicationShouldTerminate:` so it is not mistaken for a user "Quit".
  "NSAppleEventManager",
  "NSAppleEventDescriptor",
  "objc2-core-services",
] }
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
] }

# Unix-only: tao installs no signal handlers, so SIGTERM/SIGINT/SIGHUP are
# captured and funneled into the graceful-exit path (see
# `helpers::spawn_signal_handler`). tokio is already in the tree via tauri;
# this only turns on the `signal` (+ `macros` for `select!`) features.
# libc provides `kill(2)`, used to force-terminate the sidecar by pid once
# its CommandChild handle has been dropped (see sidecar::lifecycle).
[target.'cfg(unix)'.dependencies]
tokio = { version = "1", features = ["signal", "macros"] }
libc = "0.2"

# Windows-only: force-terminate the sidecar by pid via TerminateProcess once
# its CommandChild handle has been dropped (see sidecar::lifecycle). Windows
# has no POSIX signals, so the graceful path is stdin-EOF instead.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }
