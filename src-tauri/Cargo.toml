[package]
name = "kstack-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kstack_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async runtime for managing the sidecar lifecycle and UDS I/O.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "test-util"] }
# Cross-platform local sockets: UDS on Unix, AF_UNIX on Windows 10+.
interprocess = { version = "2", features = ["tokio"] }
thiserror = "1"
tokio-tungstenite = "0.24"
http = "1"
graphql-ws-client = { version = "0.13", features = ["tungstenite-0.24"] }
futures-util = "0.3"
log = "0.4"
tauri-plugin-log = "2"
libc = "0.2.186"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"

# OAuth / OIDC. `openidconnect` owns the protocol — discovery, PKCE,
# token endpoint, ID token verification (RS256 + claim/nonce checks).
# `reqwest` is rustls-only to avoid linking system OpenSSL. `keyring`
# persists the refresh token in the OS keychain (Keychain / Credential
# Manager / Secret Service).
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
once_cell = "1"
# Used only by the debug-build refresh-token file fallback (dev sidesteps
# the keychain ACL churn caused by binary signature changing each rebuild).
dirs = "5"

# Desktop-only: prevent a second launch from starting another process; the
# callback below forwards focus to the already-running instance. Critical
# because the sidecar binds a single UDS path — two hosts would race. The
# `deep-link` feature makes the plugin forward second-launch URLs into
# `tauri-plugin-deep-link`'s `on_open_url` stream on Windows/Linux (where
# the OS launches a fresh process to deliver a URL). macOS uses native
# Apple Events instead and doesn't need this glue.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[dev-dependencies]
# In-process HTTP mock for testing OIDC discovery + RFC 7009 revocation
# against a fake IdP. Pinned at 0.6 to match the `http` 1.x ecosystem
# the rest of this crate already uses.
wiremock = "0.6"

