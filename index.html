<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kstack</title>
    <script>
      // Apply the persisted color scheme before the app bundle (a deferred module)
      // loads, so a freshly opened window paints its themed background on the first
      // frame instead of flashing white. This must run ahead of any module, so it
      // can't import — it hand-mirrors readStoredPreference/resolveColorScheme in
      // src/lib/theme.tsx (key + resolution kept in sync by hand). Unknown/absent
      // values fall back to "system" (follow the OS), matching that module.
      (function () {
        try {
          var pref = localStorage.getItem('kstack:color-scheme-preference');
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* localStorage/matchMedia unavailable — leave the default (light). */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
