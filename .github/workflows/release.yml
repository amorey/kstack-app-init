name: release

permissions:
  contents: write
  deployments: write

on:
  push:
    tags:
      - "desktop/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        type: string
      signing_policy:
        description: "SignPath slug"
        required: true
        type: choice
        default: test-signing
        options:
          - test-signing
          - release-signing
      dry_run:
        description: "Dry run"
        required: false
        type: boolean
        default: true

jobs:
  config:
    name: Configure workflow
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.config.outputs.version }}
      signing_policy: ${{ steps.config.outputs.signing_policy }}
      dry_run: ${{ steps.config.outputs.dry_run }}
    steps:
      - id: config
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
            signing_policy="${{ github.event.inputs.signing_policy }}"
            dry_run="${{ github.event.inputs.dry_run }}"
          else
            version="${GITHUB_REF#refs/tags/desktop/v}"
            signing_policy="release-signing"
            dry_run="false"
          fi
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "signing_policy=${signing_policy}" >> $GITHUB_OUTPUT
          echo "dry_run=${dry_run}" >> $GITHUB_OUTPUT

  build-sidecar:
    name: Build sidecar
    needs: [config]
    strategy:
      fail-fast: false
      matrix:
        os:
          - darwin
          - linux
          - windows
        arch:
          - amd64
          - arm64
        include:
          - os: darwin
            arch: amd64
            runner: macos-26-intel
            triple: x86_64-apple-darwin
          - os: darwin
            arch: arm64
            runner: macos-26
            triple: aarch64-apple-darwin
          - os: linux
            arch: amd64
            runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
          - os: windows
            arch: amd64
            runner: windows-2025-vs2026
            triple: x86_64-pc-windows-msvc
          - os: windows
            arch: arm64
            runner: windows-11-arm
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/desktop/v${{ needs.config.outputs.version }}

      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"

      - name: Build
        shell: bash
        env:
          KSTACK_HOST_TRIPLE: ${{ matrix.triple }}
        run: ./scripts/build-sidecar.sh

      # A `debug`-tagged sidecar lets the environment redirect sign-in, and the
      # failure would be silent. Go records the build tags in the binary.
      - name: Assert the shipped sidecar is untagged
        shell: bash
        run: |
          if go version -m src-tauri/binaries/kstack-sidecar-* | grep -q -- '-tags='; then
            echo "sidecar built with tags"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          path: src-tauri/binaries/*
          name: assets-sidecar-${{ matrix.os }}-${{ matrix.arch }}

  build-bundle-linux:
    name: Build bundle · Linux
    needs: [config, build-sidecar]
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/desktop/v${{ needs.config.outputs.version }}

      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          setup-node: "true"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev librsvg2-bin \
            patchelf file desktop-file-utils xdg-utils \
            build-essential

      - name: Download sidecar artifact
        uses: actions/download-artifact@v6
        with:
          name: assets-sidecar-linux-${{ matrix.arch }}
          path: src-tauri/binaries

      # upload/download-artifact round-trips through a zip and drops the
      # Unix exec bit; without this Tauri embeds a non-executable sidecar
      # and the host panics with EACCES spawning it (os error 13).
      - name: Restore sidecar exec bit
        run: chmod +x src-tauri/binaries/*

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sidecar is prebuilt and downloaded above; override
      # beforeBuildCommand to build the frontend but not the sidecar.
      - name: Build bundle
        run: pnpm tauri build -c '{"version":"${{ needs.config.outputs.version }}","build":{"beforeBuildCommand":"pnpm build"}}'

      - name: Collect bundle
        run: |
          mkdir -p assets
          cp src-tauri/target/release/bundle/deb/*.deb assets/
          cp src-tauri/target/release/bundle/rpm/*.rpm assets/
          cp src-tauri/target/release/bundle/appimage/*.AppImage assets/

      - name: Upload bundle
        uses: actions/upload-artifact@v5
        with:
          name: assets-bundle-linux-${{ matrix.arch }}
          path: assets/*

  build-bundle-macos:
    name: Build bundle · macOS
    needs: [config, build-sidecar]
    environment: production
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/desktop/v${{ needs.config.outputs.version }}

      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          setup-node: "true"

      - name: Add x86_64 Rust target (darwin universal)
        run: rustup target add x86_64-apple-darwin

      - name: Download sidecar artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: assets-sidecar-darwin-*
          path: src-tauri/binaries
          merge-multiple: true

      # The two per-arch sidecars are built separately; Tauri's
      # externalBin for a universal target wants a single fat binary
      # named with the universal-apple-darwin triple. lipo them.
      - name: Fuse universal sidecar binary
        run: |
          cd src-tauri/binaries
          lipo -create -output kstack-sidecar-universal-apple-darwin \
            kstack-sidecar-x86_64-apple-darwin \
            kstack-sidecar-aarch64-apple-darwin
          chmod +x kstack-sidecar-universal-apple-darwin
          lipo -info kstack-sidecar-universal-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage App Store Connect API key
        run: |
          install -m 700 -d "$RUNNER_TEMP/asc"
          printf '%s' "${{ secrets.APPLE_API_KEY_CONTENT }}" \
            > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      # Sidecar is prebuilt and downloaded above; override
      # beforeBuildCommand to build the frontend but not the sidecar.
      #
      # Tauri signs the .app inside-out (embedded sidecar + frameworks →
      # app → .dmg), notarizes the .dmg with the ASC key, and staples it.
      # The APPLE_* env vars below are what its bundler looks for.
      - name: Build, sign & notarize bundle (darwin universal)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
        run: pnpm tauri build --target universal-apple-darwin -c '{"version":"${{ needs.config.outputs.version }}","build":{"beforeBuildCommand":"pnpm build"}}'

      - name: Remove staged API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

      - name: Collect bundle
        run: |
          mkdir -p assets
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg assets/

      - name: Upload signed bundle
        uses: actions/upload-artifact@v5
        with:
          name: assets-bundle-macos
          path: assets/*

  build-bundle-windows:
    name: Build bundle · Windows
    needs: [config, build-sidecar]
    environment: production
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: windows-2025-vs2026
            tauri_arch: x64
            triple: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            tauri_arch: arm64
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/desktop/v${{ needs.config.outputs.version }}

      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"
          setup-node: "true"

      - name: Download sidecar artifact
        uses: actions/download-artifact@v6
        with:
          name: assets-sidecar-windows-${{ matrix.arch }}
          path: src-tauri/binaries

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add Rust target
        run: rustup target add ${{ matrix.triple }}

      - name: Build bundle
        shell: bash
        run: pnpm tauri build --target ${{ matrix.triple }} -c '{"version":"${{ needs.config.outputs.version }}","build":{"beforeBuildCommand":"pnpm build"},"bundle":{"targets":["msi"]}}'

      # SignPath pulls this by artifact-id to sign it. Its name is
      # deliberately NOT prefixed "assets-bundle-" so the release job's
      # `pattern: assets-bundle-*` excludes it: the unsigned MSI has the
      # same internal filename as the signed one and would otherwise
      # clobber it under `merge-multiple: true`.
      - name: Upload unsigned MSI
        id: upload-artifact
        uses: actions/upload-artifact@v5
        with:
          name: signpath-input-windows-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.triple }}/release/bundle/msi/*.msi

      - name: Sign MSI with SignPath
        uses: signpath/github-action-submit-signing-request@v1.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: "kubetail"
          signing-policy-slug: ${{ needs.config.outputs.signing_policy }}
          github-artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
          artifact-configuration-slug: kstack-desktop
          wait-for-completion: true
          output-artifact-directory: assets
          parameters: |
            arch: ${{ toJSON(matrix.tauri_arch) }}
            version: ${{ toJSON(needs.config.outputs.version) }}

      - name: Upload signed MSI
        uses: actions/upload-artifact@v5
        with:
          path: assets
          name: assets-bundle-windows-${{ matrix.arch }}

  release:
    name: Create GitHub release
    needs:
      - config
      - build-bundle-linux
      - build-bundle-macos
      - build-bundle-windows
    environment: production
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/desktop/v${{ needs.config.outputs.version }}

      - name: Download bundles
        uses: actions/download-artifact@v6
        with:
          pattern: assets-bundle-*
          path: assets
          merge-multiple: true

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: assets/kstack-${{ needs.config.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA-256 checksums
        working-directory: ./assets
        run: |
          sha256sum * > SHA256SUMS

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6.3.0
        with:
          gpg_private_key: ${{ secrets.KUBETAIL_BOT_GPG_SIGNING_KEY }}
          passphrase: ${{ secrets.KUBETAIL_BOT_GPG_PASSWORD }}
          fingerprint: ${{ vars.KUBETAIL_BOT_GPG_SIGNING_KEY_FINGERPRINT }}

      - name: Sign SHA256SUMS with GPG
        working-directory: ./assets
        run: |
          gpg --armor --detach-sign SHA256SUMS

      - name: Debug
        if: ${{ needs.config.outputs.dry_run == 'true' }}
        run: |
          ls -lah assets/*
          cat assets/SHA256SUMS
          cat assets/SHA256SUMS.asc

      - name: Create release
        uses: softprops/action-gh-release@v2.3.2
        if: ${{ needs.config.outputs.dry_run == 'false' }}
        with:
          files: assets/*
          draft: true
          prerelease: ${{ contains(needs.config.outputs.version, '-') }}

      - name: Cleanup GPG
        if: always()
        run: rm -rf ~/.gnupg
