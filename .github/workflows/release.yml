name: release

permissions:
  contents: write
  deployments: write

on:
  push:
    tags:
      - "desktop/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        type: string
      signing_policy:
        description: "SignPath slug"
        required: true
        type: choice
        default: test-signing
        options:
          - test-signing
          - release-signing
      dry_run:
        description: "Dry run"
        required: false
        type: boolean
        default: true

jobs:
  config:
    name: Configure workflow
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.config.outputs.version }}
      signing_policy: ${{ steps.config.outputs.signing_policy }}
      dry_run: ${{ steps.config.outputs.dry_run }}
    steps:
      - id: config
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "signing_policy=${{ github.event.inputs.signing_policy }}" >> $GITHUB_OUTPUT
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/cli/v}" >> $GITHUB_OUTPUT
            echo "signing_policy=release-signing" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

  build-frontend:
    name: Build frontend
    needs: [config]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-environment
        with:
          setup-node: "true"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          path: dist/*
          name: assets-frontend

  build-sidecar:
    name: Build sidecar
    needs: [config]
    strategy:
      fail-fast: false
      matrix:
        os:
          - darwin
          - linux
          - windows
        arch:
          - amd64
          - arm64
        include:
          - os: darwin
            arch: amd64
            runner: macos-26-intel
            triple: x86_64-apple-darwin
          - os: darwin
            arch: arm64
            runner: macos-26
            triple: aarch64-apple-darwin
          - os: linux
            arch: amd64
            runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
          - os: windows
            arch: amd64
            runner: windows-2025-vs2026
            triple: x86_64-pc-windows-msvc
          - os: windows
            arch: arm64
            runner: windows-11-arm
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "true"

      - name: Build
        shell: bash
        env:
          KSTACK_HOST_TRIPLE: ${{ matrix.triple }}
        run: ./scripts/build-sidecar.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          path: src-tauri/binaries/*
          name: assets-sidecar-${{ matrix.os }}-${{ matrix.arch }}

  build-bundle-linux:
    name: Build bundle · Linux
    needs: [config, build-frontend, build-sidecar]
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev librsvg2-bin \
            patchelf file desktop-file-utils xdg-utils \
            build-essential

      - name: Download frontend artifact
        uses: actions/download-artifact@v6
        with:
          name: assets-frontend
          path: dist

      - name: Download sidecar artifact
        uses: actions/download-artifact@v6
        with:
          name: assets-sidecar-linux-${{ matrix.arch }}
          path: src-tauri/binaries

      # Frontend and sidecar are prebuilt and downloaded above; override
      # beforeBuildCommand so tauri doesn't rebuild them.
      - name: Build bundle
        run: pnpm tauri build -c '{"build":{"beforeBuildCommand":""}}'

  build-bundle-macos:
    name: Build bundle · macOS
    needs: [config, build-frontend, build-sidecar]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"

      - name: Add x86_64 Rust target (darwin universal)
        run: rustup target add x86_64-apple-darwin

      - name: Download frontend artifact
        uses: actions/download-artifact@v6
        with:
          name: assets-frontend
          path: dist

      - name: Download sidecar artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: assets-sidecar-darwin-*
          path: src-tauri/binaries
          merge-multiple: true

      # Frontend and sidecar are prebuilt and downloaded above; override
      # beforeBuildCommand so tauri doesn't rebuild them.
      - name: Build bundle (darwin universal)
        run: pnpm tauri build --target universal-apple-darwin -c '{"build":{"beforeBuildCommand":""}}'

  build-bundle-windows:
    name: Build bundle · Windows
    needs: [config, build-frontend, build-sidecar]
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: windows-2025-vs2026
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-environment
        with:
          setup-rust: "true"

      - name: Download frontend artifact
        uses: actions/download-artifact@v6
        with:
          name: assets-frontend
          path: dist

      - name: Download sidecar artifact
        uses: actions/download-artifact@v6
        with:
          name: assets-sidecar-windows-${{ matrix.arch }}
          path: src-tauri/binaries

      # Frontend and sidecar are prebuilt and downloaded above; override
      # beforeBuildCommand so tauri doesn't rebuild them.
      - name: Build bundle
        run: pnpm tauri build -c '{"build":{"beforeBuildCommand":""}}'
